server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # PERF-011: compress text assets on the Docker/nginx path (Vercel
  # compresses at the edge). Already-compressed formats (webp/png/glb)
  # are deliberately not listed. Brotli is not enabled: the stock
  # nginx-unprivileged image ships no brotli module, and an unknown
  # directive would fail config load.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript application/xml image/svg+xml application/manifest+json;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://api.dicebear.com https://upload.wikimedia.org https://cdn.brandfetch.io https://developer.apple.com https://khaltibyime.khalti.com https://img.favpng.com; connect-src 'self' https://api.aurainteriors.live wss://api.aurainteriors.live https://res.cloudinary.com https://*.amazonaws.com; media-src 'self' blob: https://res.cloudinary.com https://*.amazonaws.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.esewa.com.np" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # PERF-B-01: Vite emits content-hashed files under /assets/ — they
  # may be cached immutably for a year. NOTE: any add_header inside a
  # location block replaces ALL inherited add_header directives in
  # nginx, so the server-level security headers are repeated here.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://api.dicebear.com https://upload.wikimedia.org https://cdn.brandfetch.io https://developer.apple.com https://khaltibyime.khalti.com https://img.favpng.com; connect-src 'self' https://api.aurainteriors.live wss://api.aurainteriors.live https://res.cloudinary.com https://*.amazonaws.com; media-src 'self' blob: https://res.cloudinary.com https://*.amazonaws.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.esewa.com.np" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
